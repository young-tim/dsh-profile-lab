schema_version: 1
name: acceptance
cases_dir: cases
workspace_template: repo
baseline: base
variants:
  - { id: base, profile: headless, patch: variants/base.yml }
  - { id: candidate, profile: headless, patch: variants/candidate.yml }
repetitions: 5
run: { concurrency: 2, timeout_ms: 1000, max_runs: 20, max_total_tokens: 1000 }
